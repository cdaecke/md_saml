rootPageId: 1
base: 'https://typo3-acs-test.local/'
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    typo3Language: default
    locale: en_US.UTF-8
    iso-639-1: en
    navigationTitle: ''
    hreflang: en-US
    direction: ''
    flag: us
settings:
  md_saml:
    mdsamlSpBaseUrl: 'https://typo3-acs-test.local'
    publicMetadata: false

    fe_users:
      active: true
      saml:
        sp:
          entityId: '/base-entity'
          assertionConsumerService:
            url: '/index.php?loginProvider=1648123062&acs'
      createIfNotExist: true
      updateIfExist: true
      transformationArr:
        username: 'mail'

    be_users:
      saml:
        sp:
          entityId: '/typo3/index.php?loginProvider=1648123062&mdsamlmetadata'
          assertionConsumerService:
            url: '/typo3/index.php?loginProvider=1648123062&acs'
      createIfNotExist: true
      updateIfExist: true
      transformationArr:
        username: 'mail'

    saml:
      strict: true
      debug: false
      baseurl: ''
      sp:
        entityId: '/base-entity'
        assertionConsumerService:
          url: '/base-acs'
          binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
        singleLogoutService:
          url: '/index.php?loginProvider=1648123062&sls'
          binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
        NameIDFormat: 'urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified'
        x509cert: ''
        privateKey: ''
      idp:
        entityId: 'https://idp.example.com/entity'
        singleSignOnService:
          url: 'https://idp.example.com/sso'
          binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
        x509cert: 'EXT:md_saml/Tests/Fixtures/Saml/idp.crt'

      # wantXMLValidation defaults to true and validates the whole document against
      # the official saml-schema-protocol-2.0.xsd, which is strict about element
      # ordering. Signature and structural validation (signed, timestamps, audience,
      # destination, subject confirmation, ...) do not depend on it and are still
      # fully exercised — this only skips the XSD schema check for the hand-built
      # test fixture response.
      security:
        wantXMLValidation: false
